apply plugin: 'com.android.application'

android {
    namespace = "com.makeuphouse.advisor"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion "28.2.13676358"
    externalNativeBuild { cmake { path file('../../native/CMakeLists.txt'); version '3.22.1' } }
    defaultConfig {
        applicationId "com.makeuphouse.advisor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "3.2.0-dev.3"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DGGML_CPU_ARM_ARCH=armv8-a', '-DCMAKE_BUILD_TYPE=Release'
            if (System.getenv('MH_LLAMA_SOURCE_DIR')) arguments "-DLLAMA_SOURCE_DIR=${System.getenv('MH_LLAMA_SOURCE_DIR')}" } }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing — OWNER-CONTROLLED key only. Nothing secret is in the repository: the owner keeps the keystore and a
    // keystore.properties file (storeFile, storePassword, keyAlias, keyPassword) OUTSIDE git (.gitignore blocks both), and
    // points MH_KEYSTORE_PROPERTIES at it, or places it at android/keystore.properties on their own computer.
    // Without that file the release build is produced UNSIGNED (a release candidate) — never signed with a substitute key.
    def ksPropsFile = file(System.getenv('MH_KEYSTORE_PROPERTIES') ?: rootProject.file('keystore.properties').path)
    def ksProps = new Properties()
    if (ksPropsFile.exists()) { ksPropsFile.withInputStream { ksProps.load(it) } }
    signingConfigs {
        if (ksProps['storeFile']) {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Isolated engineering install; never replaces owner-signed production data.
            applicationIdSuffix ".engineering"
            versionNameSuffix "-test"
        }
        release {
            if (ksProps['storeFile']) { signingConfig signingConfigs.release }
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation files('libs/tesseract4android-4.9.0.aar')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
