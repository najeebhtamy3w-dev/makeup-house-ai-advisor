# Render Blueprint — PROTECTED CLOUD STAGING (free plan, fake demo data only). Not a production deployment.
# Free web services: ephemeral disk (SQLite data is wiped on every restart/redeploy/spin-down) and sleep after
# ~15 min idle (first request then takes ~1 min). The app shows a permanent "test copy" banner when MH_STAGING=1.
# Secrets are NEVER in this file: values marked `sync: false` are typed by the owner in Render's dashboard.
services:
  - type: web
    name: makeup-house-staging
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MH_STAGING
        value: "1"
      - key: MH_SECRET            # token-signing key, generated by Render, never visible in Git
        generateValue: true
      - key: MH_ADMIN_USER        # manager login name (owner chooses)
        sync: false
      - key: MH_ADMIN_PASSWORD    # manager password, 10+ chars (owner chooses; never sent in chat)
        sync: false
      - key: MH_STAFF_USER        # limited STAFF test account (optional)
        sync: false
      - key: MH_STAFF_PASSWORD    # 10+ chars (optional)
        sync: false
      - key: MH_ENRICH            # live Open Beauty Facts lookups (results are drafts for manager review)
        value: obf
      - key: MH_ENRICH_CONTACT    # optional contact for the OBF User-Agent (OBF asks apps to identify themselves)
        sync: false
