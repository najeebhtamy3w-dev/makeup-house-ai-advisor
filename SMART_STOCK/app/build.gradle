plugins { id 'com.android.application' }

// Release signing is read from a properties file OUTSIDE the repository
// (path given by env SMARTSTOCK_SIGNING or ~/.smartstock/signing.properties).
// No key or password is ever stored in source control. See SMART_STOCK_SIGNING_GUIDE.md.
def signingFile = new File(System.getenv('SMARTSTOCK_SIGNING') ?: (System.getProperty('user.home') + '/.smartstock/signing.properties'))
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.smartstock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartstock'   // unchanged from original prototype — never change (updates depend on it)
        minSdk 26
        targetSdk 35
        versionCode 10100                // 1.0.0 -> 10000 ; 1.0.1 -> 10001 ; 1.1.0 -> 10100
        versionName '1.1.0'
        resourceConfigurations += ['ar', 'en']
    }

    signingConfigs {
        if (signingProps['storeFile']) {
            release {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword'] ?: System.getenv('SMARTSTOCK_STORE_PASSWORD')
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword'] ?: System.getenv('SMARTSTOCK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'   // debug can be installed side-by-side with release without touching its data
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (signingProps['storeFile']) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '3g'
            testLogging { events 'failed'; exceptionFormat 'full'; showStandardStreams = false }
            systemProperty 'smartstock.out', System.getProperty('smartstock.out', '')
            systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
        }
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
